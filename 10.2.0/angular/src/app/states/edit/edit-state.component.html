
<div class="modal-header">
  <h4>Edit State</h4>
  <button type="button" class="close" (click)="bsModalRef.hide()">×</button>
</div>

<div class="modal-body">
  <form>
    <div class="form-group">
      <label>State Name</label>
      <input type="text" class="form-control" [(ngModel)]="state.name" name="name">
    </div>

    <div class="form-group">
      <label>Country</label>
      <select class="form-control" [(ngModel)]="state.countryId" name="countryId">
        <option *ngFor="let c of countries" [value]="c.id">{{ c.name }}</option>
      </select>
    </div>

    <div class="form-check">
      <input type="checkbox" class="form-check-input" [(ngModel)]="state.isActive" name="isActive">
      <label class="form-check-label">Is Active</label>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button class="btn btn-secondary" (click)="bsModalRef.hide()">Cancel</button>
  <button class="btn btn-primary" (click)="save()" [disabled]="saving">Update</button>
</div>
