
<div class="card">
  <div class="card-header d-flex justify-content-between">
    <h3>Cities</h3>
    <button class="btn btn-primary" (click)="create()">+ Create City</button>
  </div>

  <div class="card-body">
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>City Name</th>
          <th>State Id</th>
          <th>Status</th>
          <th width="160">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let city of cities">
          <td>{{ city.name }}</td>
          <td>{{ city.stateId }}</td>
          <td>
            <span class="badge" [ngClass]="city.isActive ? 'badge-success' : 'badge-danger'">
              {{ city.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>
          <td>
            <button class="btn btn-sm btn-info mr-1" (click)="edit(city)">Edit</button>
            <button class="btn btn-sm btn-danger" (click)="delete(city)">Delete</button>
          </td>
        </tr>
        <tr *ngIf="cities.length === 0">
          <td colspan="4" class="text-center">No cities found</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
