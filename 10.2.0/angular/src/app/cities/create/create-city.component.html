
<div class="modal-header">
  <h4>Create City</h4>
  <button type="button" class="close" (click)="bsModalRef.hide()">×</button>
</div>

<div class="modal-body">
  <form>
    <div class="form-group">
      <label>City Name</label>
      <input type="text" class="form-control"
             [(ngModel)]="city.name" name="name" required>
    </div>

    <div class="form-group">
      <label>State</label>
      <select class="form-control"
              [(ngModel)]="city.stateId" name="stateId" required>
        <option value="">Select State</option>
        <option *ngFor="let s of states" [value]="s.id">
          {{ s.name }}
        </option>
      </select>
    </div>

    <div class="form-check">
      <input type="checkbox" class="form-check-input"
             [(ngModel)]="city.isActive" name="isActive">
      <label class="form-check-label">Is Active</label>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button class="btn btn-secondary" (click)="bsModalRef.hide()">Cancel</button>
  <button class="btn btn-primary" (click)="save()" [disabled]="saving">Save</button>
</div>
